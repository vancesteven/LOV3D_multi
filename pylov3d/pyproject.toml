[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylov3d"
version = "0.1.0"
description = "GPU-accelerated tidal Love number computation for planetary bodies"
readme = "README.md"
license = "Apache-2.0"  # pylov3d is a derivative work of LOV3D (Rovira-Navarro et al.), Apache-2.0
requires-python = ">=3.10"
authors = [
    {name = "Steven Vance"},
    {name = "Marc Rovira-Navarro"},
]
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24",
    "py3nj>=0.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "scipy>=1.10"]
viz = ["matplotlib>=3.7", "cartopy>=0.21"]
compat = ["PlanetProfile", "pyalma3"]
mc = ["pocomc>=1.2"]

[tool.pytest.ini_options]
testpaths = ["pylov3d/tests"]
# Default lane excludes measured long-running coupled/Monte Carlo tests.
addopts = "-m 'not slow'"
# Full lane (verified): venvLOV3Dconv/bin/python -m pytest pylov3d/tests/ -q -m ""
markers = [
    "slow: exercises the get_love solver multiple times (e.g. bisection reproducibility checks); not run by default in CI-fast configs.",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pylov3d*"]
